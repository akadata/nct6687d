# SPDX-License-Identifier: GPL-2.0-or-later
name: build

# Build the driver against a spread of kernel versions so that a kernel API
# change breaks CI instead of reaching a user at `modprobe` time.
#
# The one version boundary the driver carries is 6.11, where
# platform_driver.remove changed from returning int to returning void. Both
# sides of it are covered below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # container: has to be at job level to be honoured. When it sat inside
    # strategy.matrix.include it was silently ignored and every entry ran on the
    # default runner, which meant the matrix built the same kernel eight times
    # and proved nothing. The entry is interpolated, so one job definition covers
    # all of them.
    container:
      image: ${{ matrix.image }}
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # The image decides which package manager is available; the step below
          # detects that at runtime. kver is a preference: if the image's archive
          # has no headers for it, the newest available is used and the job says
          # so, because a stale pin is not a kernel incompatibility.
          #
          # Only releases still in a distribution's archive appear here. 23.10
          # (mantic) and 24.10 (oracular) reached end of life and their apt
          # archives were removed, so those images could not install anything at
          # all -- a job failure that says nothing about the driver. 22.04 and
          # 24.04 cover the long-term-supported kernels either side of 6.11.
          #
          # Both sides of the one version boundary the driver carries, 6.11
          # for platform_driver.remove.
          - name: 5.15 (Ubuntu 22.04 LTS)
            image: ubuntu:22.04
            kver: 5.15.0-139-generic
          - name: 6.8 (Ubuntu 24.04 LTS)
            image: ubuntu:24.04
            kver: 6.8.0-60-generic

          # >= 6.11: remove() returns void.
          - name: 6.11 (Ubuntu 25.04)
            image: ubuntu:25.04
            kver: 6.11.0-28-generic
          - name: 6.12 (Debian 13)
            image: debian:trixie
            kver: 6.12.38+deb13-amd64

          - name: 6.14 (Debian 13)
            image: debian:trixie
            kver: 6.14.0-1-amd64
          - name: 6.17 (Fedora 42)
            image: fedora:42
            kver: 6.17.4-200.fc42.x86_64
          - name: mainline
            image: debian:trixie
            kver: tip

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One step for every image, using whichever package manager is actually
      # present. Gating on a matrix key with if: is unreliable here: a step so
      # gated can run outside the job's container, which is how a Fedora entry
      # ended up on an image with apt and no dnf.
      - name: Install build dependencies and kernel headers
        id: kernels
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          want="${{ matrix.kver }}"

          # A job container has no sudo and already runs as root; a hosted
          # runner has sudo and is not root. This makes one script correct on
          # both rather than every install having to check.
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi
          echo "root: $(id -u), sudo: ${SUDO:-<none>}"

          if command -v dnf >/dev/null 2>&1; then
            pkgmgr=dnf
            $SUDO dnf install -y bc elfutils-libelf-devel gcc git make
            # dnf names these kernel-devel-<version>.
            pick=""
            if [ "$want" != "tip" ] && dnf --quiet list --available "kernel-devel-${want}" >/dev/null 2>&1; then
              pick="kernel-devel-${want}"
            elif [ "$want" != "tip" ]; then
              echo "::warning::kernel-devel-${want} unavailable; using newest in image"
            fi
            if [ -z "$pick" ]; then
              pick=$(dnf --quiet list --available kernel-devel 2>/dev/null \
                    | awk '/^kernel-devel/ {print $1}' | sort -V | tail -1)
            fi
            [ -z "$pick" ] && { echo "::error::no kernel-devel in this image"; exit 1; }
            echo "installing: ${pick}"
            $SUDO dnf install -y "$pick"
            # kernel-devel unpacks headers into /usr/src/kernels/<version> and
            # does not create a /lib/modules entry of its own. Link one so the
            # rest of the job, and the Makefile, can find the build tree.
            for kd in /usr/src/kernels/*/; do
              [ -d "$kd" ] || continue
              v=$(basename "$kd")
              [ -e "/lib/modules/${v}/build" ] && continue
              $SUDO mkdir -p "/lib/modules/${v}"
              $SUDO ln -sfn "${kd%/}" "/lib/modules/${v}/build"
            done
          else
            pkgmgr=apt
            $SUDO apt-get update -qq
            $SUDO apt-get install -y --no-install-recommends bc binutils gcc git kmod make
            # apt names these linux-headers-<version>. Container images lag
            # their archive, so an exact pin regularly 404s; fall back and say
            # so, because a stale pin is not a kernel incompatibility.
            pick=""
            if [ "$want" != "tip" ] && apt-cache show "linux-headers-${want}" >/dev/null 2>&1; then
              pick="linux-headers-${want}"
            elif [ "$want" != "tip" ]; then
              echo "::warning::linux-headers-${want} unavailable in this image; using newest"
            fi
            if [ -z "$pick" ]; then
              pick=$(apt-cache search --names-only '^linux-headers-[0-9]' \
                    | awk '{print $1}' | sort -V | tail -1)
            fi
            if [ -z "$pick" ]; then
              echo "::error::no linux-headers package in this image"
              apt-cache search --names-only linux-headers | head -5 || true
              exit 1
            fi
            echo "installing: ${pick}"
            $SUDO apt-get install -y --no-install-recommends "$pick"
          fi
          echo "package manager: ${pkgmgr}"

          # Trust the directory that appeared, not the name requested: the
          # metapackage form installs a differently-versioned directory, and
          # building against a mismatched kver is silently wrong.
          kver=$(ls -1 /lib/modules 2>/dev/null | sort -V | tail -1)
          if [ -z "$kver" ] || [ ! -d "/lib/modules/${kver}/build" ]; then
            echo "::error::${pick} installed but /lib/modules has no build tree"
            ls -la /lib/modules || true
            exit 1
          fi
          echo "building against: ${kver}"
          echo "kver=${kver}" >> "$GITHUB_OUTPUT"

          # git is absent until this step installs it, and refuses the checkout
          # as "dubious ownership" until safe.directory is set.
          git config --global --add safe.directory "$(pwd)"
          $SUDO chown -R "$(id -u):$(id -g)" "/lib/modules/${kver}" 2>/dev/null || true

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          kver="${{ steps.kernels.outputs.kver }}"
          echo "requested matrix kernel: ${{ matrix.kver }}"
          echo "resolved kernel: ${kver}"
          make kver="${kver}" build
          ls -l "build/${kver}/nct6687.ko"
          modinfo "build/${kver}/nct6687.ko" | head -5

      - name: Check for warnings
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild verbosely and fail on any compiler diagnostic. A driver that
          # only builds clean by accident is not buildable on the next kernel.
          kver="${{ steps.kernels.outputs.kver }}"
          make kver="${kver}" clean
          out=$(make kver="${kver}" build 2>&1) || {
            echo "$out"; exit 1; }
          echo "$out"
          # Only diagnostics from compiling nct6687.c. kbuild emits several
          # notices that are not about this driver's code and that vary with
          # the host toolchain: the pahole/BTF version mismatch, "the compiler
          # differs from the one used to build the kernel", and "Skipping BTF
          # generation" when vmlinux is absent. Treating those as failures
          # reports a driver fault where the module built and linked cleanly.
          if echo "$out" | grep -E 'nct6687\.c:[0-9]+.*(warning|error)'; then
            echo "::error::compiler diagnostics in nct6687.c"
            exit 1
          fi
          echo "no compiler diagnostics in nct6687.c"

  dkms:
    name: dkms round-trip
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dkms and the running kernel's headers
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc binutils dkms gcc git kmod make
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"

      - name: Stage the sources the way dkms.conf expects
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/src/nct6687d-1
          sudo cp dkms.conf Makefile nct6687.c README.md /usr/src/nct6687d-1/

      - name: dkms build
        shell: bash
        run: |
          set -euo pipefail
          sudo dkms build -m nct6687d -v 1 -k "$(uname -r)"

      - name: dkms status is built
        shell: bash
        run: |
          set -euo pipefail
          status=$(dkms status -m nct6687d -v 1)
          echo "$status"
          echo "$status" | grep -q "built"

      - name: dkms remove
        shell: bash
        run: |
          set -euo pipefail
          sudo dkms remove -m nct6687d -v 1 --all
          sudo rm -rf /usr/src/nct6687d-1
