# SPDX-License-Identifier: GPL-2.0-or-later
name: build

# Build the driver against a spread of kernel versions so that a kernel API
# change breaks CI instead of reaching a user at `modprobe` time. The two
# version boundaries the driver actually cares about are:
#
#   6.11  platform_driver.remove changed from int to void
#   6.13  sensor sysfs structs moved from hwmon.h to linux/hwmon-sysfs.h
#
# Both sides of each boundary are covered below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pre-6.11: remove() must return int, hwmon-sysfs.h must not be included.
          - name: 5.15 (Ubuntu 22.04 LTS)
            container: ubuntu:22.04
            kver: 5.15.0-139-generic
          - name: 6.5 (Ubuntu 23.10)
            container: ubuntu:23.10
            kver: 6.5.0-35-generic
          - name: 6.8 (Ubuntu 24.04 LTS)
            container: ubuntu:24.04
            kver: 6.8.0-60-generic

          # 6.11 <= x < 6.13: remove() returns void, hwmon-sysfs.h must not be
          # included. This is the narrow window where both gates differ.
          - name: 6.11 (Ubuntu 24.10)
            container: ubuntu:24.10
            kver: 6.11.0-28-generic
          - name: 6.12 (Debian 13)
            container: debian:trixie
            debian: true
            kver: 6.12.38+deb13-amd64

          # >= 6.13: both gates flip, hwmon-sysfs.h is required.
          - name: 6.14 (Debian 13 updates)
            container: debian:trixie
            debian: true
            kver: 6.14.0-1-amd64
          - name: 6.17 (Fedora 42)
            container: fedora:42
            fedora: true
            kver: 6.17.4-200.fc42.x86_64
          - name: tip (newest in image)
            container: debian:trixie
            debian: true
            kver: tip

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc binutils gcc kmod make
          # No kernel headers here on purpose. The image's own kernel is not the
          # one under test, so the resolve step below installs the specific
          # kernel's headers after seeing what the archive offers. Naming a
          # kernel in advance means a pin that 404s the day the image updates.
          sudo apt-get install -y --no-install-recommends bc elfutils-dev || true

      - name: Install build dependencies (Fedora)
        if: matrix.fedora
        shell: bash
        run: |
          set -euo pipefail
          sudo dnf install -y bc elfutils-libelf-devel gcc git make
          # dnf names these kernel-devel-<version>; the apt branch below cannot
          # run on this image.
          want="${{ matrix.kver }}"
          pick=""
          if [ "$want" != "tip" ] && dnf --quiet list --available "kernel-devel-${want}" >/dev/null 2>&1; then
            pick="kernel-devel-${want}"
          else
            [ "$want" != "tip" ] && \
              echo "::warning::kernel-devel-${want} is not in this image; using the newest available"
          fi
          if [ -z "$pick" ]; then
            pick=$(dnf --quiet list --available kernel-devel 2>/dev/null \
                  | awk '/^kernel-devel/ {print $1}' | sort -V | tail -1)
          fi
          if [ -z "$pick" ]; then
            echo "::error::no kernel-devel available in this image"
            exit 1
          fi
          echo "installing: ${pick}"
          sudo dnf install -y "$pick"

          kver=$(ls -1 /lib/modules 2>/dev/null | sort -V | tail -1)
          if [ -z "$kver" ] || [ ! -d "/lib/modules/${kver}/build" ]; then
            echo "::error::${pick} installed but /lib/modules has no build tree"
            exit 1
          fi
          echo "building against: ${kver}"
          echo "kver=${kver}" >> "$GITHUB_OUTPUT"

      - name: Install headers for the kernel under test
        id: kernels
        if: ${{ !matrix.fedora }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          want="${{ matrix.kver }}"
          echo "requested: ${want}"

          if [ -n "${FEDORA:-}" ]; then
            # dnf names these kernel-devel-<version>.
            pick=""
            if [ "$want" != "tip" ] && dnf --quiet list --available "kernel-devel-${want}" >/dev/null 2>&1; then
              pick="kernel-devel-${want}"
            else
              [ "$want" != "tip" ] && \
                echo "::warning::kernel-devel-${want} is not in this image; using the newest available"
            fi
            if [ -z "$pick" ]; then
              pick=$(dnf --quiet list --available kernel-devel 2>/dev/null \
                    | awk '/^kernel-devel/ {print $1}' | sort -V | tail -1)
            fi
            if [ -z "$pick" ]; then
              echo "::error::no kernel-devel available in this image"
              exit 1
            fi
            echo "installing: ${pick}"
            sudo dnf install -y "$pick"
          else
            # apt names these linux-headers-<version>. Container images lag
            # their archive, so an exact pin regularly 404s; fall back rather
            # than fail, and say so, because a missing pin is not a driver fault.
            pick=""
            if [ "$want" != "tip" ] && apt-cache show "linux-headers-${want}" >/dev/null 2>&1; then
              pick="linux-headers-${want}"
            else
              [ "$want" != "tip" ] && \
                echo "::warning::linux-headers-${want} is not in this image's archive; using the newest available"
            fi
            if [ -z "$pick" ]; then
              pick=$(apt-cache search --names-only '^linux-headers-[0-9]' \
                    | awk '{print $1}' | sort -V | tail -1)
            fi
            if [ -z "$pick" ]; then
              echo "::error::no linux-headers package available in this image"
              apt-cache search --names-only linux-headers | head -5 || true
              exit 1
            fi
            echo "installing: ${pick}"
            sudo apt-get install -y --no-install-recommends "$pick"
          fi

          # Trust the directory that appeared, not the name we asked for: the
          # metapackage form installs a differently-versioned directory.
          kver=$(ls -1 /lib/modules 2>/dev/null | sort -V | tail -1)
          if [ -z "$kver" ] || [ ! -d "/lib/modules/${kver}/build" ]; then
            echo "::error::${pick} installed but /lib/modules has no build tree"
            ls -la /lib/modules || true
            exit 1
          fi
          echo "building against: ${kver}"
          echo "kver=${kver}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          kver="${{ steps.kernels.outputs.kver }}"
          echo "requested matrix kernel: ${{ matrix.kver }}"
          echo "resolved kernel: ${kver}"
          make kver="${kver}" build
          ls -l "build/${kver}/nct6687.ko"
          modinfo "build/${kver}/nct6687.ko" | head -5

      - name: Check for warnings
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild verbosely and fail on any compiler diagnostic. A driver that
          # only builds clean by accident is not buildable on the next kernel.
          kver="${{ steps.kernels.outputs.kver }}"
          make kver="${kver}" clean
          out=$(make kver="${kver}" build 2>&1) || {
            echo "$out"; exit 1; }
          echo "$out"
          # Only diagnostics from compiling nct6687.c. kbuild emits several
          # notices that are not about this driver's code and that vary with
          # the host toolchain: the pahole/BTF version mismatch, "the compiler
          # differs from the one used to build the kernel", and "Skipping BTF
          # generation" when vmlinux is absent. Treating those as failures
          # reports a driver fault where the module built and linked cleanly.
          if echo "$out" | grep -E 'nct6687\.c:[0-9]+.*(warning|error)'; then
            echo "::error::compiler diagnostics in nct6687.c"
            exit 1
          fi
          echo "no compiler diagnostics in nct6687.c"

  dkms:
    name: dkms round-trip
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dkms and the running kernel's headers
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc binutils dkms gcc git kmod make
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)"

      - name: Stage the sources the way dkms.conf expects
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/src/nct6687d-1
          sudo cp dkms.conf Makefile nct6687.c README.md /usr/src/nct6687d-1/

      - name: dkms build
        shell: bash
        run: |
          set -euo pipefail
          sudo dkms build -m nct6687d -v 1 -k "$(uname -r)"

      - name: dkms status is built
        shell: bash
        run: |
          set -euo pipefail
          status=$(dkms status -m nct6687d -v 1)
          echo "$status"
          echo "$status" | grep -q "built"

      - name: dkms remove
        shell: bash
        run: |
          set -euo pipefail
          sudo dkms remove -m nct6687d -v 1 --all
          sudo rm -rf /usr/src/nct6687d-1
